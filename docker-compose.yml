# Production stack (Dokploy). Env: DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, POSTGRES_PASSWORD; optional PUBLIC_URL, and for the online's
# TURN COMPOSE_PROFILES=turn, TURN_URL, TURN_SECRET (README). The data (games, saves, builds) is the host's /srv/bt3-data,
# on the system disk: the second one (/mnt/disk) is a network disk of ~250 reads/s, games stutter on it. Domain (HTTPS via Traefik): app → port 3003. Then map / to that domain in the Discord app's URL Mappings.
# (never created when missing: without it the services don't start, rather than start empty)
x-data: &data { type: bind, source: /srv/bt3-data, target: /app/data, bind: { create_host_path: false } }
# Optional: metrics and logs by OpenTelemetry (OTLP over HTTP) to SigNoz or any collector (README "Observabilidade").
# Empty: nothing goes out. Each service has its own name (hypeplay, hypeplay-ps2-builder).
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
# docker logs kept to 3 files of 10 MB per container: without it they grow on the system disk, the data's own.
x-logging: &logging { driver: json-file, options: { max-size: 10m, max-file: "3" } }

services:
  app:
    build: .
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *otel
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      # The app's own https address, for "Abrir no navegador" when Discord can't run a PS2 game in its window.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # The PS2 games' online, when two homes can't link direct. Preferred: Cloudflare's TURN (Realtime → TURN in its
      # dashboard: the key's id and token), near the players wherever they are. The reserve, given only when
      # Cloudflare's doesn't answer: the turn service below, or any coturn with --use-auth-secret.
      TURN_CF_KEY_ID: ${TURN_CF_KEY_ID:-}
      TURN_CF_TOKEN: ${TURN_CF_TOKEN:-}
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # Optional: the new PS2 games' discs go to R2 once checked (server/discs.ts), key = path under /app/data
      # (ps2/<id>/disc.iso); the games already here stay. Empty: everything stays here.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # (with R2) megabytes of the R2 discs' pieces kept in memory (server/chunkcache.ts): empty is 256, 0 none
      DISC_CACHE_MB: ${DISC_CACHE_MB:-}
      # (with R2) optional, off: the discs served by edge/worker.ts near the players (README "Edge para os discos")
      DISC_EDGE_URL: ${DISC_EDGE_URL:-}
      DISC_EDGE_SECRET: ${DISC_EDGE_SECRET:-}
      # Optional: ps2-builder workers on other machines take jobs from the builds' queue through /worker/ with this
      # token (README "Workers em outra máquina"). Empty: only the builders here, which open /app/data/queue.db.
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      # The JSON log's level: debug, info (default), warn, error.
      LOG_LEVEL: ${LOG_LEVEL:-}
      # The postgres service below: what's kept per person and the friends (server/db.ts).
      DATABASE_URL: postgres://hypeplay:${POSTGRES_PASSWORD}@postgres:5432/hypeplay
    volumes: [*data]
    depends_on:
      postgres: { condition: service_healthy }
    # GET /health (server/ops.ts): 503 once shutting down. Traefik only sends to a healthy container, so it's quick to
    # ask; the start covers the page bundles made at startup.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    # SIGTERM: the WebSockets are told to connect again and the requests going on finish (up to 10 s, ops.ts DRAIN_MS);
    # then what's pending is written. SIGKILL only past this.
    stop_grace_period: 20s

  # The PS2 games' "versão rápida" (ps2-builder/): compiles, one at a time, only the games someone asked for in the
  # library ("Compilar versão rápida"), with ps2-web-recomp. Held to 2 CPUs so calls don't suffer. A worker of the
  # builds' queue (/app/data/queue.db, server/queue.ts): more of them (here, or elsewhere through WORKER_TOKEN) build
  # more at once.
  ps2-builder:
    build:
      context: .
      dockerfile: ps2-builder/Dockerfile
    restart: unless-stopped
    logging: *logging
    cpus: "2"
    environment:
      <<: *otel
      # test runs of each game while building (more find more code, take longer) and frames per run
      PS2_ROUNDS: ${PS2_ROUNDS:-4}
      PS2_FRAMES: ${PS2_FRAMES:-3600}
      # (a game whose disc is in R2 is brought here for its build: server/discs.ts)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes: [*data]
    # Healthy while its heartbeat (ps2-builder/builder.ts' HEARTBEAT, every 5 s, idle or building) is under a minute old.
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/hypeplay-heartbeat').mtimeMs < 60000 ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # The database: each person's controller maps, keys, prefs and last game, and the friends, hours and status of
  # everyone (server/db.ts). Only on the stack's network (no ports). POSTGRES_PASSWORD is required: without it the
  # stack isn't deployed at all (rather than started without a database); letters and digits only, it goes in a URL
  # (openssl rand -hex 24). Its files are the named volume postgres, not /srv/bt3-data (README "Arquivos": backup).
  # 17 pinned: a new major needs a dump and restore (and 18 moves its data's path).
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: hypeplay
      POSTGRES_DB: hypeplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (README, Deploy)}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hypeplay", "-d", "hypeplay"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    # (a checkpoint on SIGTERM: the default 10 s may cut it short)
    stop_grace_period: 30s

  # Optional TURN relay for the PS2 games' online, for players whose networks can't reach each other directly
  # (README "Online: o TURN"). Off unless COMPOSE_PROFILES=turn; then also set TURN_SECRET and
  # TURN_URL=turn:<this server's public name>:3478, and open 3478/udp, 3478/tcp and 49160-49200/udp in the firewall.
  # It relays only to the internet: never to this machine or a private network (an open relay could reach them).
  turn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command: >-
      -n --listening-port=3478 --fingerprint --use-auth-secret --static-auth-secret=${TURN_SECRET:-}
      --realm=hypeplay --min-port=49160 --max-port=49200 --no-cli --no-tls --no-dtls --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1 --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  postgres:
