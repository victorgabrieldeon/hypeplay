<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HypePlay</title>
<!--
  A homebrew game in EmulatorJS (server/routes.ts serves it at /p/<pass>/play/?g=<slug>&p=<platform>&t=<title>, from
  the home). The ROM is ../homebrew/<slug>/rom, the emulator ../emulator/ (emulator/fetch.ts).
-->
<style>
  /* the home's tokens (DESIGN.md) */
  @font-face { font-family: "Manrope"; font-weight: 200 800; font-display: swap; src: url("../fonts/manrope-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Unbounded"; font-weight: 200 900; font-display: swap; src: url("../fonts/unbounded-latin-wght-normal.woff2") format("woff2"); }
  :root { --bg: #0b0a14; --side: #0f0d1a; --surface-top: #242040; --line: rgb(255 255 255 / 0.06); --ink: #f3f2fb; --soft: #a3a1bd;
    --accent: #a08cff; --danger: #f0384c; --r-sm: 8px; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 500 15px/24px Manrope, ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--side); border-bottom: 1px solid var(--line); }
  header a { color: var(--ink); text-decoration: none; font-weight: 600; height: 32px; display: inline-flex; align-items: center; padding: 0 12px;
    border-radius: var(--r-sm); background: var(--surface-top); transition: background 120ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  header a:hover { background: #2c2750; }
  header a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header b { font: 600 17px/26px Unbounded, ui-sans-serif, system-ui, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header small { color: var(--soft); flex: none; font-size: 13px; }
  #game { flex: 1; min-height: 0; }
  .error { color: var(--danger); padding: 24px; text-align: center; }
</style>
</head>
<body>
<header><a href="../">← Voltar</a><b id="title"></b><small id="platform"></small></header>
<div id="game"></div>
<script>
'use strict';
// Runs as an opaque origin (CSP sandbox): localStorage throws, and IndexedDB refuses to open, which EmulatorJS doesn't
// survive. A throwaway localStorage, and no IndexedDB (EmulatorJS goes without its cache): saves last the session.
try { localStorage; } catch (e) {
  const m = new Map();
  Object.defineProperty(window, 'localStorage', { value: {
    getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k),
  } });
}
try { indexedDB.open('cordplay').onsuccess = (e) => e.target.result.close(); } catch (e) { Object.defineProperty(window, 'indexedDB', { value: undefined }); }

const CORES = { GB: 'gb', GBC: 'gb', GBA: 'gba', NES: 'nes' };
const q = new URLSearchParams(location.search);
const slug = q.get('g') || '';
const core = CORES[q.get('p')];
document.getElementById('title').textContent = q.get('t') || slug;
document.getElementById('platform').textContent = q.get('p') || '';
if (!slug || !core) {
  document.getElementById('game').innerHTML = '<p class="error">Jogo não encontrado. Volte e escolha de novo.</p>';
} else {
  window.EJS_player = '#game';
  window.EJS_core = core;
  window.EJS_gameUrl = '../homebrew/' + encodeURIComponent(slug) + '/rom';
  window.EJS_gameName = slug;
  window.EJS_pathtodata = '../emulator/';
  window.EJS_language = 'pt-BR';
  window.EJS_color = '#7655ff';
  window.EJS_backgroundColor = '#0b0a14';
  window.EJS_startOnLoaded = true;
  window.EJS_disableDatabases = true; // (its cache manager, with no IndexedDB to manage)
  const s = document.createElement('script');
  s.src = '../emulator/loader.js';
  document.body.appendChild(s);
}
</script>
</body>
</html>
