<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CordPlay</title>
<!--
  CordPlay's home (server/routes.ts serves it at /p/<pass>/, framed by page/entry.html): the library, each game's
  drawer, adding a game, the controller screen and the intro. home/app.js reads `games` every 2 s. Runs as an opaque
  origin: every address here is relative, and nothing is kept in this browser. Tokens: DESIGN.md.
-->
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url("fonts/inter-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 300 700; font-display: swap; src: url("fonts/space-grotesk-latin-wght-normal.woff2") format("woff2"); }

  :root {
    --bg: #0b0a14; --side: #0f0d1a; --surface: #13111f; --surface-hi: #1b1830; --surface-top: #242040;
    --line: rgb(255 255 255 / 0.06); --ink: #f3f2fb; --soft: #a3a1bd; --faint: #6f6c8c;
    --primary: #7655ff; --primary-hi: #6a4af5; --accent: #a08cff; --ok: #3ddc84; --warn: #f5a524; --danger: #f0384c;
    --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; --body: "Inter", ui-sans-serif, system-ui, sans-serif;
    --t-xs: 600 11px/16px var(--body); --t-sm: 400 13px/20px var(--body); --t-md: 400 15px/24px var(--body);
    --t-lg: 600 17px/26px var(--body); --t-xl: 600 22px/28px var(--display); --t-2xl: 700 30px/36px var(--display);
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
    --lift: 0 18px 40px rgb(0 0 0 / 0.45), 0 0 0 1px rgb(255 255 255 / 0.06);
    --fast: 120ms; --base: 220ms; --slow: 600ms; --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --gutter: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: var(--t-md); }
  h1, h2, h3, p { margin: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  input[type=file] { display: none; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* layout */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--side); border-right: 1px solid var(--line); padding: var(--s5) var(--s3); display: flex; flex-direction: column;
    gap: var(--s5); position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2); }
  .brand img { width: 36px; height: 36px; }
  .brand b { font: 700 19px/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
  .brand small { display: block; color: var(--soft); font: var(--t-sm); margin-top: 2px; }
  .beta { font: 700 9px/1 var(--body); letter-spacing: 0.04em; padding: 3px 5px; border-radius: 4px; background: rgb(118 85 255 / 0.25); color: var(--accent); }
  nav { display: flex; flex-direction: column; gap: 2px; }
  nav button { display: flex; align-items: center; gap: var(--s3); height: 40px; padding: 0 var(--s3); border: 0; border-radius: var(--r-sm);
    background: none; color: var(--soft); font-weight: 500; cursor: pointer; text-align: left; position: relative;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
  nav button:hover { background: var(--surface); color: var(--ink); }
  nav button.on { background: rgb(118 85 255 / 0.18); color: var(--ink); }
  nav button.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--primary); }
  nav .count { margin-left: auto; font: var(--t-sm); color: var(--faint); }
  .tip { margin-top: auto; padding: var(--s4); border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
  .tip h3 { font: var(--t-lg); font-size: 15px; margin-bottom: var(--s1); }
  .tip p { color: var(--soft); font: var(--t-sm); }

  main { padding: var(--s5) var(--gutter) var(--s7); display: flex; flex-direction: column; gap: var(--s6); min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .top h1 { font: var(--t-xl); letter-spacing: -0.01em; }
  .me { display: flex; align-items: center; gap: var(--s3); color: var(--soft); font: var(--t-sm); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--body); color: #fff; background: var(--primary); }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 40px; padding: 0 var(--s4); border: 0;
    border-radius: var(--r-sm); background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: background var(--fast) var(--ease), transform var(--fast) var(--ease); }
  .btn:hover { background: var(--primary-hi); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: default; pointer-events: none; }
  .btn.second { background: var(--surface-top); color: var(--ink); }
  .btn.second:hover { background: #2c2750; }
  .btn.quiet { background: none; color: var(--soft); padding: 0 var(--s2); }
  .btn.quiet:hover { color: var(--ink); background: none; }
  .btn.danger { background: var(--surface-top); color: var(--danger); }
  .btn.small { height: 32px; padding: 0 var(--s3); font-size: 13px; }
  .btn.wide { width: 100%; }

  /* chips, badges, states */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px; background: rgb(255 255 255 / 0.08); color: #d9d8ea; }
  .seal { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px; }
  .seal.tested { background: rgb(61 220 132 / 0.16); color: var(--ok); }
  .seal.experimental { background: rgb(245 165 36 / 0.16); color: var(--warn); }
  .state { display: inline-flex; align-items: center; gap: 6px; font: var(--t-sm); font-weight: 600; color: var(--soft); }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .state.ok { color: var(--ok); } .state.warn { color: var(--warn); } .state.busy { color: var(--accent); } .state.bad { color: var(--danger); }

  /* spotlight */
  .hero { position: relative; overflow: hidden; border-radius: var(--r-lg); min-height: 300px; padding: var(--s6); display: grid;
    grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--s5); border: 1px solid var(--line); isolation: isolate; }
  .hero .backdrop { position: absolute; inset: -40px; z-index: -2; background-size: cover; background-position: center; filter: blur(36px) saturate(1.2); opacity: 0.55; }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgb(11 10 20 / 0.96) 30%, rgb(11 10 20 / 0.55) 70%, rgb(11 10 20 / 0.3)); }
  .hero .text { display: flex; flex-direction: column; gap: var(--s3); max-width: 60ch; }
  .hero h2 { font: 700 clamp(30px, 4vw, 46px)/1.05 var(--display); letter-spacing: -0.02em; }
  .hero p { color: #d9d8ea; }
  .hero .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-top: var(--s2); }
  .hero .case { width: 150px; aspect-ratio: 2 / 3; border-radius: var(--r-md); object-fit: cover; box-shadow: var(--lift); transform: rotate(3deg); }
  .live { display: inline-flex; align-items: center; gap: var(--s2); font: var(--t-sm); color: #d9d8ea; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }

  /* library */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
  .section-head h2 { font: var(--t-xl); font-size: 20px; }
  .section-head span { color: var(--soft); font: var(--t-sm); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--s5) var(--s4); }
  .card { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
  .cover { position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; padding: 0; border: 0; border-radius: var(--r-md); overflow: hidden;
    background: var(--surface); cursor: pointer; box-shadow: 0 0 0 1px var(--line);
    transition: transform var(--base) var(--ease), box-shadow var(--base) var(--ease); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / 0.22) 50%, transparent 65%);
    transform: translateX(-120%); pointer-events: none; }
  .cover:hover, .cover:focus-visible { transform: translateY(-4px); box-shadow: var(--lift); }
  .cover:hover::after { transform: translateX(120%); transition: transform var(--slow) var(--ease); }
  .card.on .cover { box-shadow: 0 0 0 2px var(--primary), var(--lift); }
  .cover .pill { position: absolute; left: var(--s2); right: var(--s2); bottom: var(--s2); padding: 6px var(--s2); border-radius: var(--r-sm);
    background: rgb(11 10 20 / 0.82); backdrop-filter: blur(6px); text-align: left; }
  .card h3 { font: var(--t-md); font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .meta { display: flex; align-items: center; gap: var(--s2); color: var(--faint); font: var(--t-sm); }
  .add { aspect-ratio: 2 / 3; border: 1.5px dashed rgb(160 140 255 / 0.35); border-radius: var(--r-md); background: rgb(118 85 255 / 0.05);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s3); padding: var(--s4); text-align: center;
    color: var(--soft); cursor: pointer; transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease); }
  .add:hover { background: rgb(118 85 255 / 0.12); border-color: var(--accent); color: var(--ink); }
  .add svg { width: 64px; height: 64px; }
  .add b { color: var(--ink); font-weight: 600; }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgb(5 4 10 / 0.6); z-index: 20; opacity: 0; pointer-events: none; transition: opacity var(--base) var(--ease); }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 21; background: var(--side); box-shadow: var(--lift);
    border-left: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden;
    transition: transform var(--base) var(--ease), visibility 0s linear var(--base); }
  .drawer.open { transform: none; visibility: visible; transition: transform var(--base) var(--ease); }
  .drawer header { display: flex; align-items: center; justify-content: space-between; padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); }
  .drawer header h2 { font: var(--t-lg); }
  .drawer .body { overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
  .game-head { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--s4); align-items: start; }
  .game-head img { width: 96px; aspect-ratio: 2 / 3; border-radius: var(--r-sm); object-fit: cover; box-shadow: 0 0 0 1px var(--line); }
  .game-head .name { font: var(--t-lg); line-height: 1.3; }
  .game-head p { color: var(--soft); font: var(--t-sm); }
  .game-head .chips { margin-top: var(--s2); }
  .field { width: 100%; height: 40px; padding: 0 var(--s3); border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-hi); color: var(--ink); }
  .field:focus { border-color: var(--accent); outline: none; }
  .block { display: flex; flex-direction: column; gap: var(--s3); }
  .block h3 { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); }
  .block p { color: var(--soft); font: var(--t-sm); }
  .block p strong { color: var(--ink); }
  .row-actions { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
  .shots img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: var(--surface); }
  pre { margin: 0; max-height: 10rem; overflow: auto; padding: var(--s3); border-radius: var(--r-sm); background: var(--surface); color: var(--soft);
    font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  .error { color: var(--danger) !important; }
  .rooms { display: flex; flex-direction: column; gap: var(--s2); }
  .room { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3); border-radius: var(--r-sm); background: var(--surface); }

  /* progress */
  .big { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); color: var(--soft); font: var(--t-sm); }
  .big b { font: var(--t-2xl); color: var(--ink); }
  .bar { height: 8px; border-radius: 99px; background: var(--surface-hi); overflow: hidden; }
  .bar > div { height: 100%; border-radius: inherit; background: var(--primary); transition: width 250ms linear; }
  .bar.moving > div { background-size: 24px 24px; animation: stripes 1s linear infinite;
    background-image: linear-gradient(45deg, rgb(255 255 255 / 0.16) 25%, transparent 25%, transparent 50%, rgb(255 255 255 / 0.16) 50%,
      rgb(255 255 255 / 0.16) 75%, transparent 75%), linear-gradient(var(--primary), var(--primary)); }
  @keyframes stripes { to { background-position: 24px 0; } }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s2); }
  .stats div { background: var(--surface); border-radius: var(--r-sm); padding: var(--s2) var(--s3); min-width: 0; }
  .stats b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats span { font: var(--t-xs); color: var(--soft); }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font: var(--t-sm); color: var(--faint); }
  .steps li { display: flex; align-items: center; gap: var(--s2); }
  .steps li.done { color: var(--ok); }
  .steps li.now { color: var(--ink); font-weight: 600; }
  .steps li.now::before { content: ""; width: 8px; height: 8px; margin: 0 5px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s var(--ease) infinite; }
  @keyframes pulse { 50% { transform: scale(0.5); opacity: 0.5; } }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface-hi); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy { display: flex; align-items: center; gap: var(--s3); color: var(--soft); }
  .drop { border: 1.5px dashed rgb(160 140 255 / 0.4); border-radius: var(--r-md); padding: var(--s5) var(--s4); display: flex; flex-direction: column;
    align-items: center; gap: var(--s3); text-align: center; background: rgb(118 85 255 / 0.05); transition: background var(--fast) var(--ease); }
  .drop.over { border-color: var(--accent); background: rgb(118 85 255 / 0.14); }
  .drop svg.i { width: 28px; height: 28px; color: var(--accent); }

  /* modal (wizard, controller) */
  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: var(--s4); background: rgb(5 4 10 / 0.7); }
  .dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--side); border-radius: var(--r-lg); box-shadow: var(--lift);
    padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); animation: rise var(--base) var(--ease); }
  .dialog.wide { width: min(760px, 100%); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .dialog header { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .dialog header h2 { font: var(--t-xl); }
  .dialog footer { display: flex; justify-content: flex-end; gap: var(--s2); flex-wrap: wrap; }

  /* intro */
  .intro { position: fixed; inset: 0; z-index: 40; background: #000; display: grid; place-items: center; cursor: pointer; animation: fade var(--base) var(--ease); }
  .intro video { width: 100%; height: 100%; object-fit: contain; }
  .intro small { position: absolute; right: var(--s5); bottom: var(--s5); color: rgb(255 255 255 / 0.6); font: var(--t-sm); }
  @keyframes fade { from { opacity: 0; } }

  .expired { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(8 8 14 / 0.9); padding: var(--s5); text-align: center; z-index: 50; }

  @media (max-width: 760px) {
    :root { --gutter: 16px; }
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; align-items: center; justify-content: space-between;
      padding: var(--s2) var(--gutter); gap: var(--s2); border-right: 0; border-bottom: 1px solid var(--line); }
    .brand small, .tip, nav .count, nav .label { display: none; }
    nav { flex-direction: row; }
    nav button { width: 40px; padding: 0; justify-content: center; }
    nav button span.t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    nav button.on::before { display: none; }
    main { padding-top: var(--s4); }
    .hero { padding: var(--s5); min-height: 0; grid-template-columns: minmax(0, 1fr); }
    .hero .case { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--s4) var(--s3); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .cover:hover, .cover:focus-visible { transform: none; }
    .cover::after { display: none; }
  }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="18" rx="1.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0-4 4m4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>

  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>

  <symbol id="art-stack" viewBox="0 0 64 64"><g fill="none" stroke-width="2"><rect x="10" y="14" width="26" height="38" rx="3" stroke="#6f6c8c" transform="rotate(-8 23 33)"/><rect x="22" y="10" width="26" height="38" rx="3" stroke="#a08cff" transform="rotate(6 35 29)"/><path d="M35 24v12M29 30h12" stroke="#a08cff" transform="rotate(6 35 29)"/></g></symbol>

<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="../../icon.svg" alt="">
      <div><b>CordPlay <span class="beta">BETA</span></b><small>Jogue junto no Discord</small></div>
    </div>
    <nav aria-label="Seções">
      <button type="button" class="on" data-nav="library"><svg class="i"><use href="#i-library"/></svg><span class="t">Biblioteca</span><span class="count num" id="n-games"></span></button>
      <button type="button" data-add><svg class="i"><use href="#i-plus"/></svg><span class="t">Adicionar jogo</span></button>
      <button type="button" data-controller><svg class="i"><use href="#i-pad"/></svg><span class="t">Controle</span></button>
    </nav>
    <div class="tip">
      <h3>Jogue com a call</h3>
      <p>Quem está no canal de voz abre o CordPlay pelo 🚀 e entra na mesma biblioteca.</p>
    </div>
  </aside>

  <main id="library">
    <div class="top">
      <h1>Biblioteca</h1>
      <div class="me" id="me"></div>
    </div>
    <section class="hero" id="hero" aria-label="Em destaque"><div class="busy"><div class="spin"></div><p>Carregando…</p></div></section>
    <section aria-labelledby="games-title">
      <div class="section-head"><h2 id="games-title">Seus jogos</h2><span>Enviados uma vez, para todo mundo</span></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-labelledby="drawer-title" role="dialog" aria-modal="true">
  <header><h2 id="drawer-title">Jogo</h2><button type="button" class="btn quiet" data-close aria-label="Fechar"><svg class="i"><use href="#i-close"/></svg></button></header>
  <div class="body" id="drawer-body"></div>
</aside>

<div id="layer"></div>
<div class="expired" id="expired" hidden><p class="error">O acesso venceu. Feche a atividade e abra de novo.</p></div>
<input id="file" type="file">

<script type="module" src="home/app.js"></script>
</body>
