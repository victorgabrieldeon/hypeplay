<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HypePlay</title>
<!--
  HypePlay's home (server/routes.ts serves it at /p/<pass>/, framed by page/entry.html): the library, each game's
  drawer, adding a game, the controller screen and the intro. home/app.js reads `games` every 2 s. Runs as an opaque
  origin: every address here is relative, and nothing is kept in this browser. Tokens: DESIGN.md.
-->
<style>
  @font-face { font-family: "Host Grotesk"; font-weight: 300 800; font-display: swap; src: url("fonts/host-grotesk-latin-wght-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Host Grotesk"; font-weight: 300 800; font-display: swap; src: url("fonts/host-grotesk-latin-ext-wght-normal.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-display: swap; src: url("fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }

  :root {
    --bg: #000; --side: #0a0a0a; --surface: #111112; --surface-hi: #18181a; --surface-top: #232325;
    --line: rgb(255 255 255 / 0.08); --line-hi: rgb(255 255 255 / 0.14); --ink: #f4f2f3; --soft: #a6a2a4; --faint: #6b6869;
    --primary: #ff5a8a; --primary-hi: #ff7aa1; --on-primary: #000; --accent: #ff8fb0; --busy: #7cc4ff; --ok: #3ddc84; --warn: #f5a524; --danger: #ff4b3e;
    --glow: transparent;
    --display: "Host Grotesk", ui-sans-serif, system-ui, sans-serif; --body: var(--display);
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --t-xs: 700 11px/16px var(--body); --t-sm: 500 13px/20px var(--body); --t-md: 500 15px/24px var(--body);
    --t-lg: 700 17px/26px var(--body); --t-xl: 650 20px/28px var(--display); --t-2xl: 650 30px/36px var(--display);
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
    --lift: 0 18px 40px rgb(0 0 0 / 0.6), 0 0 0 1px var(--line-hi);
    --fast: 120ms; --base: 220ms; --slow: 600ms; --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --gutter: 24px;
    /* the wall: whole rows of 2:3 covers in the window's height (--cols: app.js, as many as fit beside the text) */
    --bar: 56px; --gap: 2px; --rows: 3; --cols: 6;
    --tw: calc((100dvh - var(--bar) - (var(--rows) - 1) * var(--gap)) / var(--rows) * 2 / 3);
  }
  @media (max-height: 620px) { :root { --rows: 2; } }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { margin: 0; min-height: 100%; color: var(--ink); font: var(--t-md); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--primary); color: var(--on-primary); }
  /* a thin, quiet scrollbar: no arrows, no track, a grey line that lights up under the pointer */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 99px; background: rgb(255 255 255 / 0.18) padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: rgb(255 255 255 / 0.4); }
  @supports not selector(::-webkit-scrollbar) { html { scrollbar-width: thin; scrollbar-color: rgb(255 255 255 / 0.25) transparent; } }
  [hidden] { display: none !important; }
  input[type=file] { display: none; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .serial { font: 500 12px/16px var(--mono); letter-spacing: 0.04em; color: var(--soft); }

  /* layout: a thin bar on top; the words on the left (sticky); the wall of covers on the right, whole covers only */
  .app { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: var(--bar) auto; min-height: 100dvh; }
  .side { grid-column: 1 / -1; position: sticky; top: 0; z-index: 10; height: var(--bar); display: flex; align-items: center; gap: var(--s5);
    padding: 0 var(--s4); background: rgb(0 0 0 / 0.94); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .brand img { width: 28px; height: 28px; }
  .brand b { font: 700 17px/1 var(--display); letter-spacing: -0.02em; }
  .beta { font: 700 9px/1 var(--mono); letter-spacing: 0.1em; padding: 3px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-hi); color: var(--soft); }
  nav { display: flex; align-items: center; gap: 2px; min-width: 0; height: 100%; }
  nav button { display: flex; align-items: center; gap: var(--s2); height: 100%; padding: 0 var(--s3); border: 0; background: none; color: var(--soft);
    font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; position: relative; transition: color var(--fast) var(--ease); }
  nav button:hover { color: var(--ink); }
  nav button.on { color: var(--ink); }
  nav button.on::after { content: ""; position: absolute; left: var(--s3); right: var(--s3); bottom: -1px; height: 2px; background: var(--primary); }
  nav .count { font: 600 11px/1 var(--mono); color: var(--soft); padding: 3px 5px; border-radius: 4px; background: var(--surface-top); }
  nav .count:empty { display: none; }
  nav .gap { width: 1px; height: 20px; margin: 0 var(--s2); background: var(--line-hi); flex: none; }
  /* narrower windows: the sections by their icons (the name stays for screen readers and in the tooltip) */
  @media (max-width: 1240px) { nav button:not(.on) .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } }

  .lede { position: sticky; top: var(--bar); height: calc(100dvh - var(--bar)); overflow-y: auto; padding: var(--s5) var(--gutter);
    display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
  .lede h1 { font: 650 clamp(26px, 3vw, 40px)/1.05 var(--display); letter-spacing: -0.03em; text-wrap: balance; }
  .lede .sub { color: var(--soft); font: var(--t-sm); margin-top: var(--s2); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); }
  .wall-head { margin-top: auto; padding-top: var(--s4); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .wall-head h2 { font: var(--t-lg); }
  .wall-head span { color: var(--soft); font: var(--t-sm); }

  /* people around: the same call first (app.js' people) */
  #people .section-head { margin-bottom: var(--s2); }
  .people-list { display: flex; flex-direction: column; }
  .person { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; min-width: 0; }
  .person .who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .person .who b { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .who .state { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--soft); }
  .person .who .state::before { display: none; }
  .person .who small { color: var(--soft); font: var(--t-sm); font-size: 12px; }
  .person .acts { display: flex; gap: 6px; flex: none; }
  .person .tag { font: 600 10px/1 var(--mono); letter-spacing: 0.08em; color: var(--soft); margin-left: 6px; vertical-align: 1px; }
  /* friends (home/friends.js): the list here, the profile, inviting, "Amigos", toasts */
  .person.off { opacity: 0.6; }
  button.name { all: unset; cursor: pointer; border-radius: 2px; }
  button.name:hover { color: var(--accent); }
  button.name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.name:hover { text-decoration: underline; text-underline-offset: 3px; }
  button.av { all: unset; cursor: pointer; border-radius: 50%; flex: none; }
  button.av:hover .avatar, button.av:focus-visible .avatar { box-shadow: 0 0 0 2px var(--accent); }
  /* the Amigos screen (home/friends.js): #amigos, in place of the library */
  body.in-friends .lede, body.in-friends #library { display: none; }
  body.in-friends nav button.on { color: var(--soft); }
  body.in-friends nav button.on::after { content: none; }
  body.in-friends nav button[data-nav="people"] { color: var(--ink); }
  body.in-friends nav button[data-nav="people"]::after { content: ""; position: absolute; left: var(--s3); right: var(--s3); bottom: -1px; height: 2px; background: var(--primary); }
  .friends-page { grid-column: 1 / -1; width: 100%; max-width: 1180px; margin: 0 auto; padding: var(--s5) var(--gutter) var(--s7);
    display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: var(--s4) var(--s6); align-items: start; min-width: 0; }
  .fp-head { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s4); }
  .fp-head h1 { font: var(--t-2xl); letter-spacing: -0.02em; }
  .fp-head .sub { color: var(--soft); font: var(--t-sm); }
  .fp-col { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
  .fp-box { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); border-radius: var(--r-lg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .fp-box h2 { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--soft); }
  .fp-box .f-group:first-child { margin-top: 0; }
  .fp-hint { color: var(--faint); font: var(--t-xs); }
  @media (max-width: 860px) { .friends-page { grid-template-columns: 1fr; } }
  .person .tag.sent { flex: none; }
  .avatar.f { background: hsl(var(--h) 38% 22%); color: hsl(var(--h) 85% 82%); }
  .avatar.huge { width: 64px; height: 64px; font-size: 22px; }
  .f-group { display: flex; align-items: baseline; gap: var(--s2); margin: var(--s4) 0 var(--s1); font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--soft); }
  .f-group .num { color: var(--faint); }
  .link { all: unset; cursor: pointer; color: var(--accent); font: 700 12px/16px var(--body); text-transform: none; letter-spacing: 0; }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .f-empty { color: var(--soft); font: var(--t-sm); padding: var(--s2) 0; }
  .notice { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); margin: var(--s2) 0; border-radius: var(--r-md); background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line-hi); font: var(--t-sm); }
  .notice.invite { box-shadow: inset 0 0 0 1px var(--primary); flex-wrap: wrap; }
  .notice.invite img { width: 36px; aspect-ratio: 2 / 3; object-fit: cover; flex: none; }
  .notice p { flex: 1; min-width: 0; }
  .notice > svg.i { color: var(--ok); }
  .notice .acts { display: flex; gap: 6px; width: 100%; justify-content: flex-end; }
  .fm-label { display: flex; flex-direction: column; gap: 6px; font: var(--t-sm); color: var(--soft); }
  select.field { width: auto; }
  .profile > *, .dialog.wide > * { flex: none; }
  .profile header { justify-content: flex-start; }
  .profile header > .btn { margin-left: auto; align-self: flex-start; }
  .pf-who { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pf-note { color: #d8d4d6; font: var(--t-sm); font-style: italic; }
  .pf-acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
  .profile section { display: flex; flex-direction: column; gap: var(--s2); }
  .profile section h3 { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--soft); }
  .pf-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; border-radius: var(--r-md); overflow: hidden; }
  .pf-stat { display: flex; flex-direction: column; gap: 2px; padding: var(--s3) var(--s4); background: var(--surface); }
  .pf-stat b { font: 650 22px/1.1 var(--display); letter-spacing: -0.02em; }
  .pf-stat span { color: var(--soft); font: var(--t-sm); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--s2); }
  .badge { display: grid; grid-template-columns: auto 1fr; column-gap: var(--s2); padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .badge i { grid-row: span 2; width: 10px; height: 10px; margin-top: 5px; background: var(--primary); transform: rotate(45deg); }
  .badge b { font: 700 13px/20px var(--body); }
  .badge small { color: var(--soft); font: 500 12px/16px var(--body); }
  .top, .recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
  .top li, .recent li { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
  .top img, .top .nocover { width: 40px; aspect-ratio: 2 / 3; object-fit: cover; flex: none; background: var(--surface); }
  .recent img, .recent .nocover { width: 28px; aspect-ratio: 2 / 3; object-fit: cover; flex: none; background: var(--surface); }
  .top li > div, .recent li > span { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .top b, .recent b { font: 700 14px/20px var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top small, .recent small { color: var(--soft); font: 500 12px/16px var(--body); }
  .hbar { display: block; height: 4px; border-radius: 99px; background: var(--surface-top); overflow: hidden; }
  .hbar i { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
  .vs { display: flex; flex-direction: column; gap: var(--s3); }
  .vs-row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 4px var(--s3); font: 500 12px/16px var(--body); color: var(--soft); }
  .vs-row b { grid-column: 1 / -1; color: var(--ink); font: 700 14px/20px var(--body); }
  .vs-row .hbar + span + .hbar i { background: var(--accent); }
  .chips-p { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .pchip { display: inline-flex; align-items: center; gap: var(--s2); padding: 4px 10px 4px 4px; border: 0; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-hi);
    font: 600 13px/1 var(--body); cursor: pointer; }
  .pchip:hover { background: var(--surface-hi); }
  .pchip .avatar { width: 24px; height: 24px; font-size: 10px; }
  .pchip small { color: var(--soft); font-weight: 500; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: var(--s2); }
  .pick button { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--r-sm); }
  .pick img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; filter: brightness(0.75); transition: filter var(--fast) var(--ease); }
  .pick button:hover img, .pick button:focus-visible img { filter: none; }
  .pick b { font: 600 13px/16px var(--body); }
  #toasts { position: fixed; left: var(--s4); bottom: var(--s4); z-index: 40; display: flex; flex-direction: column; gap: var(--s2); pointer-events: none; }
  .toast { display: flex; align-items: center; gap: var(--s3); max-width: 340px; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--side);
    box-shadow: var(--lift); font: var(--t-sm); animation: rise 320ms var(--ease) both; }
  .toast svg.i { color: var(--ok); }
  @media (max-width: 560px) { .pf-stats { grid-template-columns: 1fr 1fr; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  .me { display: flex; align-items: center; gap: var(--s2); margin-left: auto; flex: none; height: 40px; padding: 0 5px 0 12px; border: 0; border-radius: 99px;
    background: none; color: var(--soft); font: var(--t-sm); font-weight: 600; cursor: pointer; transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
  .me:hover, .me:focus-visible { background: var(--surface-hi); color: var(--ink); }
  .me:hover .avatar, .me:focus-visible .avatar { box-shadow: 0 0 0 2px var(--accent); }
  .me .avatar { transition: box-shadow var(--fast) var(--ease); }
  .me:empty { display: none; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 700 12px/1 var(--display);
    color: var(--on-primary); background: var(--primary); }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 42px; padding: 0 18px; border: 0;
    border-radius: var(--r-sm); background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap;
    transition: background var(--fast) var(--ease), transform var(--fast) var(--ease), box-shadow var(--base) var(--ease); }
  .btn:hover { background: var(--primary-hi); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: default; pointer-events: none; }
  .btn.second { background: var(--surface-top); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .btn.second:hover { background: var(--surface-hi); }
  .btn.quiet { background: none; color: var(--soft); padding: 0 var(--s2); box-shadow: none; }
  .btn.quiet:hover { color: var(--ink); background: none; transform: none; }
  .btn.danger { background: none; color: var(--danger); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .btn.small { height: 32px; padding: 0 var(--s3); font-size: 13px; }
  .btn.wide { width: 100%; }
  .btn svg.i { transition: transform var(--base) var(--spring); }

  /* chips, badges, states */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 9px; border-radius: 6px; background: rgb(255 255 255 / 0.08); color: #d8d4d6; }
  .seal { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 9px; border-radius: 6px; }
  .seal.experimental { background: rgb(245 165 36 / 0.14); color: var(--warn); }
  .state { display: inline-flex; align-items: center; gap: 7px; font: var(--t-sm); font-weight: 700; color: var(--soft); }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .state.ok { color: var(--ok); } .state.warn { color: var(--warn); } .state.busy { color: var(--busy); } .state.bad { color: var(--danger); }
  /* the shape says it too (never color alone): ready a dot, on its way a ring, needs you a diamond, failed a square */
  .state.busy::before { background: none; box-shadow: inset 0 0 0 2px currentColor; }
  .state.warn::before { border-radius: 1px; transform: rotate(45deg) scale(0.9); }
  .state.bad::before { border-radius: 1px; }
  .state.live::before { animation: ping 1.6s var(--ease) infinite; }
  @keyframes ping { from { box-shadow: 0 0 0 0 currentColor; } to { box-shadow: 0 0 0 7px transparent; } }

  /* loading: shapes of what's coming, shimmering */
  .sk { border-radius: var(--r-sm); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-top) 50%, var(--surface) 70%);
    background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .sk.l1 { width: 120px; height: 14px; } .sk.l2 { width: min(420px, 70%); height: 40px; } .sk.l3 { width: min(300px, 50%); height: 16px; }
  .sk.l4 { width: 150px; height: 42px; } .sk.cover-sk { display: block; height: 100%; border-radius: 0; } .sk.name { width: 70%; height: 14px; }

  /* spotlight ("Continuar jogando"): the game's name, why it's here, and how to play */
  .hero { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s3); padding-top: var(--s4); border-top: 1px solid var(--line); }
  .hero h2 { font: 650 22px/1.15 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
  .hero .why { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); color: var(--soft); font: var(--t-sm); }
  .hero p { color: var(--soft); font: var(--t-sm); max-width: 52ch; }
  .hero .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
  .hero.loading { gap: var(--s3); }
  .live { display: inline-flex; align-items: center; gap: var(--s2); font: var(--t-sm); color: var(--ink); }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: ping 1.6s var(--ease) infinite; color: var(--ok); }
  .live .code { font: 700 13px/1 var(--mono); letter-spacing: 0.14em; }

  /* the first look: the words rise, then the wall lights up cover by cover */
  .entering .lede > * { animation: rise 600ms var(--ease) both; }
  .entering .lede > :nth-child(2) { animation-delay: 80ms; } .entering .lede > :nth-child(3) { animation-delay: 160ms; }
  .entering .card, .entering .add { animation: light 700ms var(--ease) both; animation-delay: calc(120ms + min(var(--i, 0), 18) * 40ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes light { from { opacity: 0; } }

  /* the wall: covers edge to edge, dimmed until they're pointed at; each one's name and state in a black plate at its
     foot, over where a generated cover draws the name (so no text sits on text, and a sent cover without a title still
     says what it is). The spotlight and games with an open room are twice as big (library.js arrange). */
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--s1) var(--s3); margin-bottom: var(--s5); }
  .section-head h2 { font: var(--t-lg); white-space: nowrap; }
  .section-head span { color: var(--soft); font: var(--t-sm); }
  main { width: calc(var(--cols) * var(--tw) + (var(--cols) - 1) * var(--gap)); min-width: 0; }
  .probe { position: absolute; width: var(--tw); height: 0; visibility: hidden; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols), var(--tw)); grid-auto-rows: calc(var(--tw) * 1.5); gap: var(--gap); grid-auto-flow: dense; }
  .grid > .busy, .grid > .note { grid-column: 1 / -1; }
  .card { position: relative; min-width: 0; scroll-margin-top: var(--bar); }
  .card.big { grid-column: span 2; grid-row: span 2; }
  .cover { position: relative; display: block; width: 100%; height: 100%; padding: 0; border: 0; overflow: hidden; background: var(--surface); cursor: pointer;
    text-align: left; color: var(--ink); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.62) saturate(0.9);
    transition: filter var(--base) var(--ease), transform var(--slow) var(--ease); }
  .cover:hover img, .cover:focus-visible img, .card.on .cover img { filter: none; transform: scale(1.035); }
  /* focus and the drawer's game: a ring drawn over the art (an outline or inset shadow would sit under the image) */
  .cover::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .cover:focus-visible { outline: none; }
  .cover:focus-visible::after, .pad-mode .cover.pad-focus::after { box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 0 5px #000; }
  .card.on .cover::after { box-shadow: inset 0 0 0 2px var(--primary); }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; min-height: 27%; padding: 10px 10px 9px; background: #000; display: flex; flex-direction: column;
    justify-content: flex-end; gap: 3px; }
  .cap b { font: 650 13px/1.25 var(--display); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .cover:hover .cap b, .cover:focus-visible .cap b, .pad-focus .cap b { -webkit-line-clamp: 3; }
  .cap .state { font-size: 12px; line-height: 16px; min-width: 0; }
  .cap .state span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .big .cap { padding: 16px 16px 14px; gap: 6px; }
  .big .cap b { font-size: 20px; line-height: 24px; letter-spacing: -0.02em; -webkit-line-clamp: 2; }
  .big .cap .state { font-size: 13px; }
  /* how far an upload or a build is: a line on the seam between the art and the plate */
  .cap .seam { position: absolute; left: 0; right: 0; top: -2px; height: 2px; background: linear-gradient(90deg, currentColor var(--p), rgb(255 255 255 / 0.14) 0); }
  .cap .seam.busy { color: var(--busy); } .cap .seam.warn { color: var(--warn); } .cap .seam.bad { color: var(--danger); }
  /* a game coming from vimm.net (library.js installCard): its cover dimmed and a pie filling, like a phone's app installing */
  @property --p { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
  .installing { --p: 0%; transition: --p 0.3s linear; }
  .installing .cover { cursor: default; }
  .installing .cover img, .installing .cover:hover img { filter: grayscale(0.5) brightness(0.45); transform: none; }
  .installing .pie { position: absolute; left: 50%; top: 36%; width: 34%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
    border: 3px solid rgb(255 255 255 / 0.92); padding: 3px; background: conic-gradient(rgb(255 255 255 / 0.92) var(--p), rgb(0 0 0 / 0.45) 0) content-box; }
  /* finding the link, or opening the archive: the ring turns */
  .installing.resolving .pie, .installing.extracting .pie { border-top-color: transparent; animation: spin 1s linear infinite; }
  .add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s2); padding: var(--s4); border: 0; background: var(--side);
    text-align: center; color: var(--soft); font: var(--t-sm); font-size: 12px; cursor: pointer; transition: background var(--base) var(--ease), color var(--base) var(--ease); }
  .add:hover, .add:focus-visible { background: var(--surface-hi); color: var(--ink); }
  .add svg { width: 56px; height: 56px; color: var(--faint); overflow: visible; }
  .add svg rect, .add svg path { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 420ms var(--spring); }
  .add:hover .back { transform: rotate(-14deg) translateX(-4px); }
  .add:hover .front { transform: rotate(10deg) translateX(4px); }
  .add:hover .plus { transform: translate(4px, -2px) rotate(90deg); transform-origin: 50% 50%; }
  .add b { color: var(--ink); font: 700 14px/1.3 var(--body); }

  .note { color: var(--soft); font: var(--t-sm); }
  .note svg.i { vertical-align: -4px; color: var(--warn); }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 20; opacity: 0; pointer-events: none;
    transition: opacity var(--base) var(--ease); }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 21; background: var(--side);
    box-shadow: -30px 0 60px -20px rgb(0 0 0 / 0.8), -1px 0 0 var(--line-hi); display: flex; flex-direction: column; transform: translateX(100%);
    visibility: hidden; transition: transform 320ms var(--ease), visibility 0s linear 320ms; }
  .drawer.open { transform: none; visibility: visible; transition: transform 320ms var(--ease); }
  .drawer header { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); }
  .drawer header h2 { font: var(--t-lg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer .body { position: relative; isolation: isolate; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
  /* the game's cover on top of the drawer, as a poster (a click changes it); the cover clicked on the wall grows into it */
  .drawer .body { padding-top: 0; }
  .poster { position: relative; display: block; margin: 0 calc(-1 * var(--s5)); padding: 0; border: 0; background: var(--surface); cursor: pointer; flex: none; }
  .poster img { display: block; width: 100%; height: clamp(180px, 38dvh, 340px); object-fit: cover; object-position: 50% 30%; }
  .poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, var(--side)); pointer-events: none; }
  .poster span { position: absolute; right: var(--s4); top: var(--s4); z-index: 1; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-sm);
    background: rgb(0 0 0 / 0.8); color: var(--ink); font: 700 12px/1 var(--body); opacity: 0; transition: opacity var(--fast) var(--ease); }
  .poster:hover span, .poster:focus-visible span { opacity: 1; }
  .poster svg.i { width: 14px; height: 14px; }
  .poster:focus-visible { outline-offset: -2px; }
  .flying { position: fixed; z-index: 25; object-fit: cover; pointer-events: none; }
  .game-head { display: flex; flex-direction: column; gap: 6px; margin-top: calc(-1 * var(--s6)); position: relative; }
  .game-head .name { font: 650 24px/1.15 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
  .game-head p { color: var(--soft); font: var(--t-sm); }
  .game-head .chips { margin-top: var(--s1); align-items: center; }
  .field { width: 100%; height: 42px; padding: 0 var(--s3); border-radius: var(--r-sm); border: 1px solid var(--line-hi); background: var(--surface-hi);
    color: var(--ink); transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
  .field::placeholder { color: var(--soft); }
  .field:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgb(255 143 176 / 0.2); }
  .block { display: flex; flex-direction: column; gap: var(--s3); }
  .block h3 { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--soft); }
  .block p { color: var(--soft); font: var(--t-sm); }
  .block p strong { color: var(--ink); }
  .row-actions { display: flex; flex-wrap: wrap; gap: var(--s2); }
  pre { margin: 0; max-height: 10rem; overflow: auto; padding: var(--s3); border-radius: var(--r-sm); background: var(--surface); color: var(--soft);
    font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .error { color: var(--danger) !important; }
  .rooms { display: flex; flex-direction: column; gap: var(--s2); }
  .room { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3); border-radius: var(--r-sm);
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .room .code { font: 700 13px/1 var(--mono); letter-spacing: 0.14em; color: var(--accent); }

  /* progress */
  .big { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); color: var(--soft); font: var(--t-sm); }
  .big b { font: var(--t-2xl); color: var(--ink); letter-spacing: -0.02em; }
  .bar { height: 8px; border-radius: 99px; background: var(--surface-hi); overflow: hidden; }
  .bar > div { height: 100%; border-radius: inherit; background: var(--primary); box-shadow: 0 0 12px var(--glow); transition: width 250ms linear; }
  .bar.moving > div { background-size: 24px 24px; animation: stripes 1s linear infinite;
    background-image: linear-gradient(45deg, rgb(255 255 255 / 0.16) 25%, transparent 25%, transparent 50%, rgb(255 255 255 / 0.16) 50%,
      rgb(255 255 255 / 0.16) 75%, transparent 75%), linear-gradient(var(--primary), var(--primary)); }
  @keyframes stripes { to { background-position: 24px 0; } }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s2); }
  .stats div { background: var(--surface); border-radius: var(--r-sm); padding: var(--s2) var(--s3); min-width: 0; box-shadow: inset 0 0 0 1px var(--line); }
  .stats b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats span { font: var(--t-xs); color: var(--soft); }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font: var(--t-sm); color: var(--soft); }
  .steps li { display: flex; align-items: center; gap: var(--s2); }
  .steps li.done { color: var(--ok); }
  .steps li.now { color: var(--ink); font-weight: 700; }
  .steps li.now::before { content: ""; width: 8px; height: 8px; margin: 0 5px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s var(--ease) infinite; }
  @keyframes pulse { 50% { transform: scale(0.5); opacity: 0.5; } }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface-hi); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy { display: flex; align-items: center; gap: var(--s3); color: var(--soft); }
  .drop { border: 1.5px dashed rgb(255 255 255 / 0.22); border-radius: var(--r-md); padding: var(--s5) var(--s4); display: flex; flex-direction: column;
    align-items: center; gap: var(--s3); text-align: center; background: var(--surface); transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease); }
  .drop.over { border-color: var(--accent); background: var(--surface-hi); }
  .drop > svg.i { width: 30px; height: 30px; color: var(--accent); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }

  /* modal (wizard, controller) */
  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: var(--s4); background: rgb(0 0 0 / 0.75); }
  .dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--side); border-radius: var(--r-lg);
    box-shadow: 0 40px 80px -20px rgb(0 0 0 / 0.8), 0 0 0 1px var(--line-hi); padding: 28px; display: flex; flex-direction: column; gap: var(--s4);
    animation: pop 260ms var(--ease); }
  .dialog.wide { width: min(760px, 100%); }
  /* the loja (store.js): a page in place of the library, #loja and #loja/<id> */
  body.in-store .lede, body.in-store #library { display: none; }
  .store { grid-column: 1 / -1; width: 100%; max-width: 1280px; margin: 0 auto; padding: var(--s5) var(--gutter) var(--s7); display: flex; flex-direction: column; gap: var(--s6); min-width: 0; }
  .store a.btn { text-decoration: none; }
  .store-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3) var(--s5); }
  .store-head h1 { font: var(--t-2xl); letter-spacing: -0.02em; }
  .store-search { display: flex; gap: var(--s2); flex: 1; max-width: 520px; }
  .store-hero, .store-game { position: relative; display: flex; align-items: flex-end; gap: var(--s6); padding: var(--s6); border-radius: var(--r-lg); overflow: hidden;
    min-height: 380px; background: var(--surface); isolation: isolate; }
  .store-hero .bg, .store-game .bg { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover; filter: blur(2px) brightness(0.5) saturate(1.1); transform: scale(1.03); }
  .store-hero::after, .store-game::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgb(0 0 0 / 0.85), rgb(0 0 0 / 0.2) 70%), linear-gradient(0deg, rgb(0 0 0 / 0.7), transparent 50%); }
  .store-hero .box img, .store-game .box { width: 200px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: var(--r-md); box-shadow: var(--lift); display: block; flex: none; }
  .store-hero .about, .store-game .about { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s3); min-width: 0; }
  .store-hero h2, .store-game h1 { font: 700 clamp(26px, 3.4vw, 40px)/1.1 var(--display); letter-spacing: -0.02em; }
  .store-hero .tag { font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--primary); }
  .store-hero .dots { display: flex; gap: 6px; margin-top: var(--s2); }
  .store-hero .dots button { width: 24px; height: 4px; padding: 0; border: 0; border-radius: 2px; background: rgb(255 255 255 / 0.3); cursor: pointer; }
  .store-hero .dots button.on { background: var(--primary); }
  .store-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: var(--s4); overflow-x: auto; padding-bottom: var(--s3); scroll-snap-type: x mandatory; }
  .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--s5) var(--s4); }
  .store-tile { display: flex; flex-direction: column; gap: 6px; color: var(--ink); text-decoration: none; scroll-snap-align: start; min-width: 0; }
  .store-tile .art { position: relative; display: block; aspect-ratio: 2 / 3; border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .store-tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--slow) var(--ease); }
  .store-tile:hover img, .store-tile:focus-visible img { transform: scale(1.04); }
  .store-tile:focus-visible { outline: none; } .store-tile:focus-visible .art { box-shadow: 0 0 0 3px var(--accent); }
  .store-tile .rank { position: absolute; left: 0; top: 0; padding: 4px 9px; background: rgb(0 0 0 / 0.8); color: var(--ink); font: 700 15px/1.2 var(--display); font-style: normal; border-bottom-right-radius: var(--r-md); }
  .store-tile b { font: 600 13px/1.3 var(--display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .store-tile small { color: var(--soft); font: var(--t-xs); font-weight: 500; }
  .store-back { color: var(--soft); text-decoration: none; font: var(--t-sm); align-self: flex-start; }
  .store-back:hover { color: var(--ink); }
  .store-game { align-items: flex-start; min-height: 0; }
  .store-game .box { width: 260px; }
  .store-game dl { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); }
  .store-game dt { color: var(--soft); font: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; }
  .store-game dd { font: var(--t-md); }
  .install { margin-top: var(--s3); padding: var(--s5); border-radius: var(--r-lg); background: rgb(10 10 10 / 0.85); box-shadow: inset 0 0 0 1px var(--line-hi);
    display: flex; flex-direction: column; gap: var(--s4); max-width: 620px; backdrop-filter: blur(8px); }
  .install h2 { font: var(--t-xl); }
  .install ol { display: flex; flex-direction: column; gap: var(--s4); padding-left: 1.2em; }
  .install li { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); color: #d8d4d6; }
  .install li.done p { color: var(--soft); }
  .install .row-actions { width: 100%; } .install .field { flex: 1; min-width: 220px; width: auto; }
  @media (max-width: 760px) {
    .store-hero, .store-game { flex-direction: column; align-items: flex-start; padding: var(--s5); }
    .store-hero .box img { width: 120px; } .store-game .box { width: 160px; }
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
  .dialog header { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
  .dialog header h2 { font: var(--t-xl); letter-spacing: -0.02em; }
  .dialog > p { color: #d8d4d6; }
  .dialog footer { display: flex; justify-content: flex-end; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s2); }
  .stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
  .stepper li { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s2); font: var(--t-xs); text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stepper li::before { content: ""; height: 4px; border-radius: 99px; background: var(--surface-top); transition: background var(--base) var(--ease); }
  .stepper li.done::before { background: var(--accent); }
  .stepper li[aria-current=step] { color: var(--ink); }
  .stepper li[aria-current=step]::before { background: var(--primary); box-shadow: 0 0 12px var(--glow); }
  .callout { display: flex; gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: rgb(245 165 36 / 0.08);
    box-shadow: inset 0 0 0 1px rgb(245 165 36 / 0.2); color: #d8d4d6; font: var(--t-sm); }
  .callout svg.i { color: var(--warn); margin-top: 1px; }
  /* "Onde jogar?" inside Discord (home/intro.js) */
  .where-options { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
  .where-option { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: var(--s4); border: 0; border-radius: var(--r-md);
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-hi); color: var(--ink); text-align: left; cursor: pointer;
    transition: background var(--fast) var(--ease), box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease); }
  .where-option:hover { background: var(--surface-hi); box-shadow: inset 0 0 0 1px var(--accent); transform: translateY(-2px); }
  .where-option.best { background: var(--surface-hi); box-shadow: inset 0 0 0 1px var(--primary); }
  .where-option b { font: 700 15px/1.3 var(--body); }
  .where-option span { color: var(--soft); font: var(--t-sm); }
  .where-option svg.i { width: 22px; height: 22px; color: var(--accent); }
  .where-option:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: inset 0 0 0 1px var(--line); }
  .where-status { display: flex; flex-direction: column; gap: var(--s2); }
  .where-status .copy { display: flex; gap: var(--s2); }
  .where-status .link { align-self: flex-start; color: var(--accent); font: 700 13px/20px var(--body); }
  .where-status .mine { color: var(--soft); font: 500 12px/16px var(--body); }
  @media (max-width: 560px) { .where-options { grid-template-columns: 1fr; } }
  /* the Servidor screen (home/settings.js) */
  .setting { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); padding: var(--s4); border-radius: var(--r-md);
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .setting > div:first-child { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
  .setting h3 { font: var(--t-lg); font-size: 15px; }
  .setting p { color: var(--soft); font: var(--t-sm); }
  .setting .row-actions { flex: none; justify-content: flex-end; }
  @media (max-width: 760px) { .setting { flex-direction: column; align-items: stretch; } }
  .callout.ok { background: rgb(61 220 132 / 0.07); box-shadow: inset 0 0 0 1px rgb(61 220 132 / 0.2); }
  .callout.ok svg.i { color: var(--ok); }
  .check { display: flex; gap: var(--s2); align-items: center; cursor: pointer; font-weight: 700; }
  .check input { width: 18px; height: 18px; accent-color: var(--primary); }

  /* controller screen */
  .pads { display: flex; flex-direction: column; gap: var(--s2); }
  .pad-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3); border-radius: var(--r-sm);
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
  .pad-row b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
  .pad-row .chip { margin: 0 var(--s2); }
  /* the pad drawings (home/pads.js): PS2, PS5, Xbox */
  .padart { width: 100%; max-width: 520px; margin: 0 auto; display: block; filter: drop-shadow(0 20px 30px rgb(0 0 0 / 0.5)); animation: fade var(--base) var(--ease); }
  .padart .k { fill: var(--surface-top); stroke: rgb(255 255 255 / 0.12); stroke-width: 2; transition: fill var(--fast) var(--ease); }
  .padart .k.want { fill: var(--primary); animation: pulse 1.2s var(--ease) infinite; transform-box: fill-box; transform-origin: center; }
  .padart .k.lit { fill: var(--accent); }
  .pad-readings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2); }
  .pad-readings > div { padding: var(--s2); border: 1px solid var(--line-hi); border-radius: var(--r-sm); font: var(--t-sm); }
  .pad-readings output { display: block; color: var(--soft); font-variant-numeric: tabular-nums; }
  .pad-readings .lit { background: var(--accent); color: var(--on-primary); }
  .pad-readings .lit output { color: var(--on-primary); }
  .pad-axes { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s3); }
  .pad-axes output { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pad-test-hint, .pad-debug { color: var(--soft); font: var(--t-sm); }
  .pad-debug summary { cursor: pointer; padding: var(--s2) 0; }
  .pad-debug pre { white-space: pre-wrap; overflow-wrap: anywhere; font: var(--t-sm); font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .pad-readings { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .padart .body { fill: var(--surface); stroke: rgb(255 255 255 / 0.1); stroke-width: 2; }
  .padart .plate { fill: var(--surface-hi); stroke: rgb(255 255 255 / 0.08); stroke-width: 2; }
  .padart text { fill: var(--ink); font: 700 15px var(--body); text-anchor: middle; pointer-events: none; }
  .padart text.sm { font: 800 11px var(--body); letter-spacing: 0.06em; }
  .padart text.out { fill: var(--soft); font-size: 10px; }
  .padart .mark { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
  /* Xbox's own face colors */
  .padart .c-a { fill: #3ddc84; } .padart .c-b { fill: #ff5d6c; } .padart .c-x { fill: #5aa9ff; } .padart .c-y { fill: #f5c524; }
  .family { display: inline-flex; align-self: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-hi); }
  .family button { border: 0; border-radius: 7px; padding: 8px 16px; background: none; color: var(--soft); font: 700 13px/1 var(--body); cursor: pointer;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }
  .family button:hover { color: var(--ink); }
  .family button[aria-pressed=true] { background: var(--primary); color: var(--on-primary); }
  .waiting { display: flex; flex-direction: column; align-items: center; gap: var(--s4); padding: var(--s3) 0 var(--s2); }
  .waiting .padart { max-width: 360px; opacity: 0.7; animation: fade var(--base) var(--ease), float 6s ease-in-out infinite; }
  .ask { text-align: center; font: 600 18px/1.4 var(--display); letter-spacing: -0.01em; }
  .ask small { display: block; font: var(--t-sm); color: var(--soft); margin-top: 4px; }

  /* intro */
  .intro { position: fixed; inset: 0; z-index: 40; background: #000; display: grid; place-items: center; cursor: pointer; animation: fade var(--base) var(--ease); }
  .intro video { width: 100%; height: 100%; object-fit: contain; }
  .intro small { position: absolute; right: var(--s5); bottom: var(--s5); color: rgb(255 255 255 / 0.6); font: var(--t-sm); }
  @keyframes fade { from { opacity: 0; } }

  /* with a controller (home/gamepadnav.js): the focus stands out like a console's, and the buttons are shown */
  .pad-mode .pad-focus { outline: 3px solid var(--accent); outline-offset: 3px; box-shadow: 0 0 0 6px rgb(255 143 176 / 0.16);
    transition: transform var(--base) var(--ease), box-shadow var(--base) var(--ease); }
  .pad-mode .cover.pad-focus { outline: none; box-shadow: none; }
  .pad-mode .cover.pad-focus img { filter: none; transform: scale(1.035); }
  .pad-mode body { cursor: none; }
  .pad-hints { position: fixed; right: 16px; bottom: 16px; z-index: 45; display: none; gap: 14px; padding: 8px 14px; border-radius: 99px;
    background: rgb(0 0 0 / 0.9); box-shadow: 0 0 0 1px var(--line-hi), 0 12px 30px -10px rgb(0 0 0 / 0.8);
    font: 700 12px/20px var(--body); color: var(--soft); }
  .pad-mode .pad-hints { display: flex; animation: fade var(--base) var(--ease); }
  .pad-hints span { display: inline-flex; align-items: center; gap: 6px; }
  .pad-hints i { font-style: normal; min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 99px;
    background: var(--surface-top); color: var(--ink); font: 700 11px/1 var(--body); }
  .expired { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.9); padding: var(--s5); text-align: center; z-index: 50; }

  /* phones: the words on top, then the wall in three columns, edge to edge */
  @media (max-width: 760px) {
    :root { --gutter: 16px; --cols: 3; --tw: calc((100vw - 2 * var(--gap)) / 3); }
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { gap: var(--s2); padding: 0 var(--s2) 0 var(--gutter); }
    .brand b, .beta, nav .count, nav .gap, .me span { display: none; }
    nav { overflow-x: auto; scrollbar-width: none; }
    nav button { padding: 0 10px; }
    nav button .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .lede { position: static; height: auto; }
    .wall-head { margin-top: 0; }
    main { width: 100%; }
    .dialog { padding: var(--s5); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .cover:hover, .cover:focus-visible, .add:hover, .btn:hover { transform: none; }
    .cover:hover img, .cover:focus-visible img, .card.on .cover img { transform: none; }
  }
</style>
</head>
