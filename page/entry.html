<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budokai Tenkaichi 3</title>
<!--
  Where the Activity opens (server/routes.ts serves it at /). entry.js signs in with Discord, trades the code for a
  pass and frames the game's page, p/<pass>/. This page stays: it holds the Discord SDK's connection.
-->
<style>
  html, body { margin: 0; height: 100%; background: #07070c; color: #a0a2b8;
    font: 15px/1.5 "Inter Variable", ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  #msg { margin: 0; padding: 16px; text-align: center; }
  #msg.error { color: #f0384c; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<p id="msg">Entrando pelo Discord…</p>
<!-- Games want controllers, sound without a click first, and full screen. -->
<iframe id="game" title="Budokai Tenkaichi 3" allow="gamepad; autoplay; fullscreen" hidden></iframe>
<script type="module" src="entry.js"></script>
</body>
</html>
