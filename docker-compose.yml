# Production stack (Dokploy). Env: DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET (README).
# Domain (HTTPS via Traefik): app → port 3003. Then map / to that domain in the Discord app's URL Mappings.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
    volumes:
      - bt3-data:/app/data

  # Compiles the game from the disc image sent through the Activity (builder/).
  # Idle, it only looks at the volume every 5 s; a build is once per disc image, held to 2 CPUs so calls don't suffer.
  builder:
    build: builder
    restart: unless-stopped
    cpus: "2"
    volumes:
      - bt3-data:/app/data

volumes:
  bt3-data:
